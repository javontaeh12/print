<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintCraft Studio — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a1628;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: #132035;
      border-radius: 16px;
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .login-logo .monogram {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #00b4d8, #0096b7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    .login-logo .text {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    .login-logo .text span {
      color: #00b4d8;
    }

    .login-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: #adb5bd;
      margin-bottom: 2rem;
    }

    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: #fff;
      color: #343a40;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: box-shadow 0.3s, transform 0.2s;
      width: 100%;
      justify-content: center;
    }

    .google-btn:hover {
      box-shadow: 0 4px 12px rgba(0,180,216,0.3);
      transform: translateY(-1px);
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
    }

    .login-error {
      color: #e74c3c;
      font-size: 0.875rem;
      margin-top: 1rem;
      display: none;
    }

    .login-footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #495057;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">
      <div class="monogram">P</div>
      <div class="text">Print<span>Craft</span></div>
    </div>
    <h1 class="login-title">Admin Portal</h1>
    <p class="login-subtitle">Sign in with your authorized Google account</p>

    <button class="google-btn" id="googleSignIn">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </button>

    <p class="login-error" id="loginError"></p>

    <p class="login-footer">Only authorized administrators can access this portal.</p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // These will be replaced with actual values once Supabase project is created
    const SUPABASE_URL = 'https://bfdpgapvrnlegizpjflf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmZHBnYXB2cm5sZWdpenBqZmxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyMjU5NzEsImV4cCI6MjA4NTgwMTk3MX0.zwZwS8zryRpuVYzzCkeujoI3fNcylvctd_v--_3ZAcU';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Check if already logged in
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      window.location.href = '/admin/';
    }

    document.getElementById('googleSignIn').addEventListener('click', async () => {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/admin/'
        }
      });

      if (error) {
        const errorEl = document.getElementById('loginError');
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
